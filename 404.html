<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanted Wiki - Page Not Found</title>
    <link rel="icon" type="image/webp" href="/images/logo.webp">

    <meta name="robots" content="noindex, nofollow">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            visibility: hidden;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 1.2rem;
            text-align: center;
        }
        main {
            max-width: 720px;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        a {
            color: #fff;
        }
    </style>
</head>

<body>
    <main>
        <h1>Page not found</h1>
        <p>The page you requested does not exist.</p>
        <nav aria-label="Wiki sections">
            <a href="/">Home</a>
            <a href="/?route=%2Fweapons">Weapons</a>
            <a href="/?route=%2Fvehicles">Vehicles</a>
            <a href="/?route=%2Fgun-crates">Gun Crates</a>
            <a href="/?route=%2Fmissions">Missions</a>
            <a href="/?route=%2Fnpcs">NPCs</a>
            <a href="/?route=%2Flocations">Locations</a>
            <a href="/?route=%2Fatms">ATMs &amp; Vaults</a>
            <a href="/?route=%2Fvaluables">Valuables</a>
            <a href="/?route=%2Fstore">Store</a>
            <a href="/?route=%2Fitems">Items</a>
            <a href="/?route=%2Fevents">Events</a>
            <a href="/?route=%2Fpromo-codes">Promo Codes</a>
        </nav>
    </main>
    <script>
        (function () {
            const pages = new Set(['weapons', 'vehicles', 'gun-crates', 'missions', 'npcs', 'locations', 'atms', 'valuables', 'store', 'items', 'events', 'promo-codes']);
            const page = window.location.pathname.replace(/^\/+|\/+$/g, '');
            if (pages.has(page) && !window.location.hash) {
                window.location.replace(`/?route=${encodeURIComponent('/' + page)}`);
                return;
            }
            document.body.style.visibility = 'visible';
        })();
    </script>
</body>

</html>
