<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanted Wiki - Redirecting...</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.webp">
    <link rel="canonical" href="https://wantedrblx.com/">

    <meta name="robots" content="noindex, nofollow">

    <script>
        (function () {
            var validPages = ["home", "valuables", "atms", "weapons", "vehicles", "gun-crates", "missions", "npcs", "locations", "store", "events", "promo-codes"];
            var path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '').replace('.html', '');
            var hash = validPages.includes(path) ? '#' + path : '';
            window.location.replace('/' + hash);
        })();
    </script>

    <style>
        body {
            margin: 0;
            background: #000;

            display: flex;

            min-height: 100vh;
            font-size: 1.2rem;
        }
    </style>
</head>
