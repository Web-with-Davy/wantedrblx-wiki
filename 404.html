<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanted Wiki - Page Not Found</title>
    <link rel="icon" type="image/webp" href="/images/logo.webp">

    <meta name="robots" content="noindex, nofollow">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 1.2rem;
            text-align: center;
        }
        main {
            max-width: 720px;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        a {
            color: #fff;
        }
    </style>
</head>

<body>
    <main>
        <h1>Page not found</h1>
        <p>The page you requested does not exist.</p>
        <nav aria-label="Wiki sections">
            <a href="/#">Home</a>
            <a href="/#weapons">Weapons</a>
            <a href="/#vehicles">Vehicles</a>
            <a href="/#gun-crates">Gun Crates</a>
            <a href="/#missions">Missions</a>
            <a href="/#npcs">NPCs</a>
            <a href="/#locations">Locations</a>
            <a href="/#atms">ATMs &amp; Vaults</a>
            <a href="/#valuables">Valuables</a>
            <a href="/#store">Store</a>
            <a href="/#items">Items</a>
            <a href="/#events">Events</a>
            <a href="/#promo-codes">Promo Codes</a>
        </nav>
    </main>
    <script>
        (function () {
            const pages = new Set(['weapons', 'vehicles', 'gun-crates', 'missions', 'npcs', 'locations', 'atms', 'valuables', 'store', 'items', 'events', 'promo-codes']);
            const page = window.location.pathname.replace(/^\/+|\/+$/g, '');
            if (pages.has(page) && !window.location.hash) window.location.replace(`/#${page}`);
        })();
    </script>
</body>

</html>
